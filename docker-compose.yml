services:
  portfolio:
    build:
      context: .
      args:
        SITE_DOMAIN: ${SITE_DOMAIN:-addisonmoore.me}
    ports:
      - "80:3000"
    restart: always
    healthcheck:
      # 127.0.0.1, not localhost: the server binds IPv4 only, and busybox wget
      # would otherwise try the ::1 entry in /etc/hosts and be refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
